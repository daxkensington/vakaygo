name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: node scripts/check-lint.mjs
      - run: npm run typecheck
      - run: npm run check:i18n
      - run: npm test -- --run
        env:
          NODE_ENV: test
      - run: node tests/regression/business-onboarding.cjs

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit
          POSTGRES_DB: vakaygo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U audit -d vakaygo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://audit:audit@localhost:5432/vakaygo_test
      AUTH_SECRET: ci-only-secret-for-isolated-booking-tests-32chars
      RESEND_API_KEY: re_ci_only_no_live_email
      VAKAYGO_CI_DATABASE_PROXY: 1
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: ./.github/actions/prepare-test-db
      - name: Verify audit regressions against isolated PostgreSQL
        run: npm test -- --run tests/unit/enhanced-claims-db.test.ts tests/unit/concierge-memory-db.test.ts tests/unit/discovery-capacity-db.test.ts tests/unit/listing-price-currency-db.test.ts tests/unit/discovery-map-db.test.ts tests/unit/listing-similarity-db.test.ts tests/unit/admin-analytics-db.test.ts tests/unit/listing-bookability-db.test.ts tests/unit/phone-verification-db.test.ts tests/unit/trip-planner-persistence-db.test.ts tests/unit/grenada-experiences-db.test.ts
        env:
          VAKAYGO_CLAIM_DB_TESTS: "true"
          VAKAYGO_CONCIERGE_DB_TESTS: "true"
          VAKAYGO_DISCOVERY_DB_TESTS: "true"
          VAKAYGO_PHONE_DB_TESTS: "true"
          VAKAYGO_EXPERIENCES_DB_TESTS: "true"
          NODE_OPTIONS: --import ${{ github.workspace }}/tests/ci/fetch-preload.mjs
      - run: npm run build
        env:
          NODE_OPTIONS: --import ${{ github.workspace }}/tests/ci/fetch-preload.mjs
      - run: npx playwright test
        env:
          NODE_OPTIONS: --import ${{ github.workspace }}/tests/ci/fetch-preload.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit
          POSTGRES_DB: vakaygo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U audit -d vakaygo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://audit:audit@localhost:5432/vakaygo_test
      AUTH_SECRET: ci-only-secret-for-isolated-booking-tests-32chars
      RESEND_API_KEY: re_ci_only_no_live_email
      VAKAYGO_CI_DATABASE_PROXY: 1
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/prepare-test-db
      - run: npm run build
        env:
          NODE_OPTIONS: --import ${{ github.workspace }}/tests/ci/fetch-preload.mjs
      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          lhci autorun
        env:
          NODE_OPTIONS: --import ${{ github.workspace }}/tests/ci/fetch-preload.mjs
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit
          POSTGRES_DB: vakaygo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U audit -d vakaygo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://audit:audit@localhost:5432/vakaygo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply migrations to an empty isolated database
        run: |
          for migration in drizzle/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify email identity and session revocation
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/account-bootstrap.sql
      - name: Verify campaign delivery evidence and irreversible suppression
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/outreach-tracking.sql
      - name: Verify Sendcorex B2B reservations and global unsubscribe
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/sendcorex-outreach.sql
      - name: Verify campaign administration and health gates
        run: node tests/sql/render-outreach-controls.cjs | psql "$DATABASE_URL" -v ON_ERROR_STOP=1
      - name: Verify campaign reservation and recipient permission gates
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/outreach-reservations.sql
      - name: Verify final dispatch rechecks
        run: node tests/sql/render-outreach-dispatch.cjs | psql "$DATABASE_URL" -v ON_ERROR_STOP=1
      - name: Verify concurrent campaign limits
        run: bash tests/sql/concurrency-outreach.sh
      - name: Verify invitation attribution and global opt-out
        run: node tests/sql/render-outreach-attribution.cjs | psql "$DATABASE_URL" -v ON_ERROR_STOP=1
      - name: Verify directory interest and outreach isolation
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/listing-interest.sql
      - name: Verify automated business claim proof
        run: node tests/sql/render-business-onboarding.cjs | psql "$DATABASE_URL" -v ON_ERROR_STOP=1
      - name: Verify inventory and transactional notifications
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/booking-integrity.sql
      - name: Verify concurrent reservation exclusion
        run: bash tests/sql/concurrent-booking.sh
      - name: Verify default-closed onboarding and revocation
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/onboarding-eligibility.sql
