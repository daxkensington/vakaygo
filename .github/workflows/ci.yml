name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
        continue-on-error: true # Existing lint debt; changed files receive focused lint review.
      - run: npm run typecheck
      - run: npm run check:i18n
      - run: npm test -- --run
        env:
          NODE_ENV: test

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit
          POSTGRES_DB: vakaygo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U audit -d vakaygo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://audit:audit@localhost:5432/vakaygo_test
      AUTH_SECRET: ci-only-secret-for-isolated-booking-tests-32chars
      RESEND_API_KEY: re_ci_only_no_live_email
      VAKAYGO_CI_DATABASE_PROXY: 1
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: ./.github/actions/prepare-test-db
      - run: npm run build
        env:
          NODE_OPTIONS: --import ${{ github.workspace }}/tests/ci/fetch-preload.mjs
      - run: npx playwright test
        env:
          NODE_OPTIONS: --import ${{ github.workspace }}/tests/ci/fetch-preload.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit
          POSTGRES_DB: vakaygo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U audit -d vakaygo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://audit:audit@localhost:5432/vakaygo_test
      AUTH_SECRET: ci-only-secret-for-isolated-booking-tests-32chars
      RESEND_API_KEY: re_ci_only_no_live_email
      VAKAYGO_CI_DATABASE_PROXY: 1
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/prepare-test-db
      - run: npm run build
        env:
          NODE_OPTIONS: --import ${{ github.workspace }}/tests/ci/fetch-preload.mjs
      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          lhci autorun
        env:
          NODE_OPTIONS: --import ${{ github.workspace }}/tests/ci/fetch-preload.mjs
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
